<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Três Encontros · Administração</title>
<link rel="icon" href="icones/icone.svg" type="image/svg+xml">
<style>
  :root { --bg:#F4F3F8; --card:#fff; --ink:#1E2033; --muted:#666A82; --line:#DEDDEA; --accent:#3D3A8C; --ok:#2F7A55; --warn:#B4465E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121424; --card:#1B1E33; --ink:#ECEBF5; --muted:#A3A5BE; --line:#2C3050; --accent:#B7A5F7; --ok:#8FD4A8; --warn:#F08EA2; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)); display:grid; gap:18px; }
  h1 { margin:0; font-size:26px; } h2 { margin:0 0 10px; font-size:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
  .linha { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  label { display:grid; gap:4px; font-weight:600; font-size:14px; }
  input { padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; min-width:0; }
  button { padding:10px 16px; border-radius:10px; border:0; background:var(--accent); color:var(--card); font:inherit; font-weight:700; cursor:pointer; }
  button.sec { background:transparent; color:var(--ink); border:1px solid var(--line); }
  .mudo { color:var(--muted); } .erro { color:var(--warn); font-weight:600; }
  .tabela { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap; font-size:14px; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
  .cod { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight:700; letter-spacing:.06em; }
  .pill { padding:2px 8px; border-radius:999px; font-size:12px; font-weight:700; background:var(--bg); }
  .pill.ok { color:var(--ok); } .pill.bloq { color:var(--warn); }
  pre { white-space:pre-wrap; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; margin:10px 0 0; font-size:14px; }
  .resumo { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
  .resumo div { background:var(--bg); border-radius:10px; padding:10px 12px; } .resumo b { display:block; font-size:22px; }
</style>
</head>
<body>
<main>
  <header><h1>Três Encontros · Administração</h1><p class="mudo">Gere os códigos de acesso e acompanhe quem está fazendo a jornada.</p></header>

  <section class="card" id="login">
    <h2>Entrar</h2>
    <form class="linha" id="formLogin">
      <label>Senha do administrador<input type="password" id="senha" autocomplete="current-password" required></label>
      <button type="submit">Entrar</button>
    </form>
    <p class="erro" id="erroLogin" hidden></p>
  </section>

  <div id="painel" hidden style="display:grid;gap:18px">
    <section class="card">
      <h2>Gerar códigos</h2>
      <form class="linha" id="formGerar">
        <label>Quantidade<input type="number" id="qtd" min="1" max="200" value="1" style="width:110px"></label>
        <label style="flex:1 1 220px">Observação (nome do comprador, igreja, pedido)<input id="obs" maxlength="80" placeholder="Ex.: Maria, pedido 1234"></label>
        <button type="submit">Gerar</button>
      </form>
      <div id="novos"></div>
    </section>

    <section class="card">
      <div class="linha" style="justify-content:space-between;align-items:center"><h2 style="margin:0">Códigos</h2><button class="sec" id="atualizar">Atualizar</button></div>
      <div class="resumo" id="resumo" style="margin:12px 0"></div>
      <div class="tabela"><table><thead><tr><th>Código</th><th>Observação</th><th>Nome</th><th>Início</th><th>Dia</th><th>Encontros</th><th>Último acesso</th><th></th></tr></thead><tbody id="lista"></tbody></table></div>
    </section>
  </div>
</main>
<script>
(function () {
  var senha = "";
  try { senha = sessionStorage.getItem("te-admin") || ""; } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  function api(acao, dados) {
    return fetch("api.php", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ acao: acao, senha: senha }, dados || {})) })
      .then(function (r) { return r.json(); });
  }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function data(iso) { if (!iso) return "—"; var d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); }
  var link = location.href.replace(/admin\.html.*$/, "");

  function mensagem(codigo) {
    return "Seu acesso ao Três Encontros chegou!\n\n30 dias com o Espírito Santo, Jesus e Deus Pai: um encontro ao acordar, outro no almoço e outro antes de dormir.\n\n1. Abra: " + link + "\n2. Toque em “Tenho um código de acesso”\n3. Digite: " + codigo + "\n\nDica: adicione o app à tela inicial do celular para receber os avisos.";
  }

  function entrar() {
    api("admin_entrar").then(function (r) {
      if (!r.ok) { $("erroLogin").textContent = r.erro; $("erroLogin").hidden = false; return; }
      try { sessionStorage.setItem("te-admin", senha); } catch (e) {}
      $("login").hidden = true; $("painel").hidden = false; listar();
    }).catch(function () { $("erroLogin").textContent = "Sem conexão com o servidor."; $("erroLogin").hidden = false; });
  }

  function listar() {
    api("admin_listar").then(function (r) {
      if (!r.ok) return;
      var ativos = r.codigos.filter(function (c) { return c.inicio && c.dia <= 30; }).length;
      var concl = r.codigos.filter(function (c) { return c.concluidos >= 90 || c.dia > 30; }).length;
      $("resumo").innerHTML = "<div><b>" + r.codigos.length + "</b>códigos</div><div><b>" + r.codigos.filter(function (c) { return !c.inicio; }).length + "</b>ainda não usados</div><div><b>" + ativos + "</b>em jornada</div><div><b>" + concl + "</b>concluídos</div><div><b>" + r.celularesComAviso + "</b>celulares com aviso</div>";
      $("lista").innerHTML = r.codigos.map(function (c) {
        var status = c.bloqueado ? '<span class="pill bloq">bloqueado</span>' : (c.inicio ? '<span class="pill ok">ativo</span>' : '<span class="pill">novo</span>');
        return "<tr><td class=\"cod\">" + esc(c.codigo) + " " + status + "</td><td>" + esc(c.observacao) + "</td><td>" + esc(c.nome) + "</td><td>" + esc(c.inicio || "—") + "</td><td>" + (c.inicio ? Math.min(c.dia, 31) : "—") + "</td><td>" + c.concluidos + "/90</td><td>" + data(c.ultimoAcesso) + "</td>" +
          '<td><button class="sec" data-cop="' + esc(c.codigo) + '">Copiar mensagem</button> <button class="sec" data-bloq="' + esc(c.codigo) + '" data-v="' + (c.bloqueado ? 0 : 1) + '">' + (c.bloqueado ? "Desbloquear" : "Bloquear") + "</button></td></tr>";
      }).join("") || '<tr><td colspan="8" class="mudo">Nenhum código ainda. Gere o primeiro acima.</td></tr>';
    });
  }

  function copiar(texto, botao) {
    var ok = function () { botao.textContent = "Copiado"; setTimeout(function () { botao.textContent = "Copiar mensagem"; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(texto).then(ok, function () { prompt("Copie:", texto); });
    else prompt("Copie:", texto);
  }

  $("formLogin").addEventListener("submit", function (e) { e.preventDefault(); senha = $("senha").value; entrar(); });
  $("formGerar").addEventListener("submit", function (e) {
    e.preventDefault();
    api("admin_gerar", { quantidade: +$("qtd").value, observacao: $("obs").value }).then(function (r) {
      if (!r.ok) { alert(r.erro); return; }
      $("novos").innerHTML = '<p class="mudo" style="margin-top:12px">Códigos gerados. Envie um para cada pessoa:</p>' + r.codigos.map(function (c) {
        return '<pre>' + esc(mensagem(c)) + '</pre><button class="sec" data-cop="' + c + '">Copiar mensagem</button>';
      }).join("");
      $("obs").value = ""; listar();
    });
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.cop) copiar(mensagem(b.dataset.cop), b);
    if (b.dataset.bloq) api("admin_bloquear", { codigo: b.dataset.bloq, bloquear: b.dataset.v === "1" }).then(listar);
  });
  $("atualizar").addEventListener("click", listar);
  if (senha) entrar();
})();
</script>
</body>
</html>
