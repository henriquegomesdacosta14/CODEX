<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Configurar a Secretária</title>
<style>
  :root {
    --bg: #f3f5f2; --surface: #ffffff; --line: #dde3dc; --fg: #17201b; --muted: #5f6d64;
    --accent: #13866f; --accent-fg: #fff; --soft: #eef6f3; --me: #dcf3ea; --claude: #ffffff; --warn: #b4321f; --warn-bg: #fdecea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1412; --surface: #151d1a; --line: #26322d; --fg: #e4ebe7; --muted: #92a199;
      --accent: #2bb394; --accent-fg: #06201a; --soft: #13221d; --me: #123b31; --claude: #1a2420; --warn: #ff8a75; --warn-bg: #3a1a15; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; }
  header { background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); padding-top: calc(10px + env(safe-area-inset-top)); }
  header .in { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 1.1rem; margin: 0; flex: 1 1 auto; }
  header a, header button { font-size: 14px; }
  main { flex: 1; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right)) 16px max(16px, env(safe-area-inset-left)); }
  #lista { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; box-shadow: 0 1px 0 rgba(0,0,0,.05); }
  .msg .quem { font-size: 12px; font-weight: 600; color: var(--accent); margin-bottom: 2px; display: flex; gap: 8px; }
  .msg .quem time { color: var(--muted); font-weight: 400; }
  .msg.pessoa { background: var(--me); align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.claude { background: var(--claude); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul { margin: 4px 0 6px; padding-left: 20px; }
  .msg blockquote { margin: 0; padding: 1px 10px; border-left: 3px solid var(--accent); background: var(--soft); }
  .acao { align-self: flex-start; font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 10px; padding: 6px 10px; max-width: 88%; white-space: pre-wrap; overflow-wrap: anywhere; }
  .erro { align-self: center; font-size: 14px; color: var(--warn); background: var(--warn-bg); border-radius: 10px; padding: 8px 12px; }
  .digitando { align-self: flex-start; color: var(--muted); font-style: italic; font-size: 14px; }
  .boasvindas { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 10px; }
  .boasvindas h2 { margin: 0; font-size: 1.1rem; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips button { border-radius: 999px; font-size: 14px; }
  footer { background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
  footer form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  textarea, input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); width: 100%; min-width: 0; }
  footer textarea { resize: none; max-height: 160px; min-height: 46px; }
  button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); padding: 9px 14px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--accent); }
  #login { max-width: 460px; margin: 40px auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
  #login label { display: grid; gap: 4px; font-size: 14px; font-weight: 500; }
  [hidden] { display: none !important; }
  .pend { max-width: 860px; margin: 0 auto 10px; background: var(--soft); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .pend ul { margin: 6px 0 0; padding-left: 20px; }
</style>
</head>
<body>
<header>
  <div class="in">
    <h1>Configurar a Secretária</h1>
    <span id="eu" class="muted" style="font-size:14px;color:var(--muted)"></span>
    <a href="cadastro.html" target="_blank" rel="noopener">Ver formulário</a>
    <button type="button" id="btnPend" hidden>Pendências</button>
    <button type="button" id="btnNova" hidden>Nova conversa</button>
  </div>
</header>

<main id="main">
  <section id="login">
    <h2 style="margin:0;font-size:1.2rem">Bem-vinda!</h2>
    <p style="margin:0;color:var(--muted)">Aqui vocês conversam com o Claude sobre as informações da clínica. Ele pergunta, organiza e já ensina a secretária do WhatsApp.</p>
    <label for="nome">Seu nome<input id="nome" autocomplete="given-name" placeholder="Ex.: Juliana"></label>
    <label for="senha">Senha<input id="senha" type="password" autocomplete="current-password"></label>
    <button class="primary" type="button" id="btnEntrar">Entrar</button>
    <p id="erroLogin" style="margin:0;color:var(--warn)"></p>
  </section>
  <div id="pendBox" class="pend" hidden></div>
  <div id="lista" hidden></div>
</main>

<footer id="rodape" hidden>
  <form id="form">
    <textarea id="texto" rows="1" placeholder="Escreva aqui…" aria-label="Mensagem"></textarea>
    <button class="primary" type="submit" id="btnEnviar">Enviar</button>
  </form>
</footer>

<script>
  const $ = (id) => document.getElementById(id);
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  let senha = '', nome = '', total = 0, enviando = false, poll = null;

  // Markdown simples: **negrito**, listas com "- ", parágrafos
  function md(t) {
    const linhas = esc(t).split('\n'); let html = '', lista = false;
    for (const l of linhas) {
      const cit = l.match(/^\s*&gt;\s?(.*)/);
      if (cit) { if (lista) { html += '</ul>'; lista = false; } html += '<blockquote>' + (cit[1] || '&nbsp;') + '</blockquote>'; continue; }
      const item = l.match(/^\s*[-•*]\s+(.*)/);
      if (item) { if (!lista) { html += '<ul>'; lista = true; } html += '<li>' + item[1] + '</li>'; continue; }
      if (lista) { html += '</ul>'; lista = false; }
      if (l.trim()) html += '<p>' + l + '</p>';
    }
    if (lista) html += '</ul>';
    return html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<strong>$2</strong>');
  }
  const hora = (iso) => { try { return new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch { return ''; } };

  async function api(acao, extra = {}) {
    const r = await fetch('assistente.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ senha, acao, ...extra }) });
    const j = await r.json().catch(() => ({ erro: 'Resposta inválida do servidor (HTTP ' + r.status + '). A resposta pode ter demorado demais; recarregue a página.' }));
    if (!r.ok || j.erro) throw new Error(j.erro || 'HTTP ' + r.status);
    return j;
  }

  function boasVindas() {
    const d = document.createElement('div'); d.className = 'boasvindas'; d.id = 'bv';
    d.innerHTML = `<h2>Como funciona</h2>
      <p>O Claude vai perguntar sobre a clínica aos poucos: horários, serviços, preços, convênios, regras e o jeito de falar com os pacientes. Tudo o que vocês responderem ele salva e a secretária do WhatsApp já aprende. Vocês duas podem participar desta mesma conversa.</p>
      <div class="chips">
        <button type="button">Vamos começar o cadastro da clínica</button>
        <button type="button">Como a secretária vai funcionar?</button>
        <button type="button">O que ainda falta preencher?</button>
        <button type="button">Teste: um paciente pergunta quanto custa a consulta</button>
      </div>`;
    d.querySelector('.chips').onclick = (e) => { if (e.target.tagName === 'BUTTON') enviar(e.target.textContent); };
    $('lista').appendChild(d);
  }

  function adicionar(it) {
    $('bv')?.remove();
    const d = document.createElement('div');
    if (it.tipo === 'acao') { d.className = 'acao'; d.textContent = it.texto; }
    else if (it.tipo === 'erro') { d.className = 'erro'; d.textContent = it.texto; }
    else {
      d.className = 'msg ' + (it.tipo === 'claude' ? 'claude' : 'pessoa');
      d.innerHTML = `<div class="quem">${esc(it.autor)}<time>${hora(it.em)}</time></div>` + md(it.texto);
    }
    $('lista').appendChild(d);
  }

  function rolar() { $('main').scrollTop = $('main').scrollHeight; }

  function mostrarDigitando(ocupado) {
    $('dig')?.remove();
    if (!ocupado) return;
    const d = document.createElement('div'); d.className = 'digitando'; d.id = 'dig';
    d.textContent = 'Claude está respondendo' + (ocupado.quem && ocupado.quem !== nome ? ` a ${ocupado.quem}` : '') + '…';
    $('lista').appendChild(d); rolar();
  }

  function aplicar(j) {
    const novos = j.itens || [];
    novos.forEach(adicionar);
    total = j.total ?? total + novos.length;
    if (novos.length) rolar();
    if (!enviando) mostrarDigitando(j.ocupado);
  }

  async function atualizar() {
    if (enviando) return;
    try { aplicar(await api('historico', { desde: total })); } catch {}
  }

  async function enviar(texto) {
    texto = String(texto || '').trim();
    if (!texto || enviando) return;
    enviando = true; $('btnEnviar').disabled = true; $('texto').value = ''; ajustar();
    adicionar({ tipo: 'pessoa', autor: nome, texto, em: new Date().toISOString() });
    const local = total + 1; // já mostramos a mensagem da pessoa
    mostrarDigitando({ quem: nome }); rolar();
    try {
      const j = await api('enviar', { autor: nome, texto, desde: local });
      $('dig')?.remove(); total = local; aplicar(j);
    } catch (e) {
      $('dig')?.remove(); adicionar({ tipo: 'erro', texto: e.message }); rolar();
    } finally { enviando = false; $('btnEnviar').disabled = false; $('texto').focus(); }
  }

  function ajustar() { const t = $('texto'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 160) + 'px'; }

  async function entrar() {
    nome = $('nome').value.trim(); senha = $('senha').value;
    if (!nome) { $('erroLogin').textContent = 'Digite seu nome.'; return; }
    try {
      const j = await api('historico', { desde: 0 });
      store.set('cfg_nome', nome);
      $('login').hidden = true; $('lista').hidden = false; $('rodape').hidden = false; $('btnNova').hidden = false; $('btnPend').hidden = false;
      $('eu').textContent = 'Você: ' + nome;
      $('lista').innerHTML = ''; total = 0;
      if (!j.itens.length) boasVindas();
      aplicar(j); rolar();
      poll = setInterval(atualizar, 5000);
      $('texto').focus();
    } catch (e) { $('erroLogin').textContent = e.message; }
  }

  $('nome').value = store.get('cfg_nome') || '';
  $('btnEntrar').onclick = entrar;
  $('senha').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
  $('form').addEventListener('submit', (e) => { e.preventDefault(); enviar($('texto').value); });
  $('texto').addEventListener('input', ajustar);
  $('texto').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width: 700px)').matches) { e.preventDefault(); enviar($('texto').value); } });

  $('btnNova').onclick = async (e) => {
    const b = e.currentTarget;
    if (!b.dataset.confirmar) { b.dataset.confirmar = '1'; b.textContent = 'Confirmar: começar do zero?'; setTimeout(() => { delete b.dataset.confirmar; b.textContent = 'Nova conversa'; }, 5000); return; }
    try { await api('nova_conversa'); $('lista').innerHTML = ''; total = 0; boasVindas(); b.textContent = 'Nova conversa'; delete b.dataset.confirmar; }
    catch (err) { adicionar({ tipo: 'erro', texto: err.message }); }
  };
  $('btnPend').onclick = async () => {
    const box = $('pendBox');
    if (!box.hidden) { box.hidden = true; return; }
    try {
      const j = await api('pendencias');
      box.innerHTML = j.pendencias.length ? '<strong>Anotado para o desenvolvedor</strong><ul>' + j.pendencias.map((p) => `<li>${esc(p.texto)} <small>(${hora(p.em)})</small></li>`).join('') + '</ul>' : 'Nenhuma pendência anotada para o desenvolvedor.';
      box.hidden = false;
    } catch (err) { adicionar({ tipo: 'erro', texto: err.message }); }
  };
</script>
</body>
</html>
